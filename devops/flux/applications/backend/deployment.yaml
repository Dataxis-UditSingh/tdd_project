apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdd-backend
  namespace: tdd-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tdd-backend
  template:
    metadata:
      labels:
        app: tdd-backend
    spec:
      serviceAccountName: tdd-backend
      containers:
        - name: backend
          image: docker.io/uditdataxis12345/tdd-react-backend:20261126114741-34d6449 # {"$imagepolicy": "flux-system:tdd-react-backend"}
          ports:
            - containerPort: 4000

          env:
            - name: OTEL_SERVICE_NAME
              value: tdd-backend

            - name: OTEL_TRACES_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318/v1/traces

            - name: OTEL_NODE_EXPERIMENTAL_SDK_METRICS
              value: "true"

            - name: PORT
              value: "4000"

            - name: OTEL_LOGS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: tdd-backend-secrets
                  key: OTEL_LOGS_ENDPOINT
            - name: OTEL_METRICS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: tdd-backend-secrets
                  key: OTEL_METRICS_ENDPOINT
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: openbao-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: openbao-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tdd-backend-openbao
