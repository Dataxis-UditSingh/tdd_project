apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tdd-backend-openbao
  namespace: tdd-backend
spec:
  provider: openbao

  parameters:
    roleName: "tdd-backend"

    objects: |
      - objectName: "OTEL_LOGS_ENDPOINT"
        secretPath: "secret/data/tdd-backend"
        secretKey: "OTEL_LOGS_ENDPOINT"

      - objectName: "OTEL_METRICS_ENDPOINT"
        secretPath: "secret/data/tdd-backend"
        secretKey: "OTEL_METRICS_ENDPOINT"

  secretObjects:
    - secretName: tdd-backend-secrets
      type: Opaque
      data:
        - objectName: OTEL_LOGS_ENDPOINT
          key: OTEL_LOGS_ENDPOINT

        - objectName: OTEL_METRICS_ENDPOINT
          key: OTEL_METRICS_ENDPOINT