apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdd-frontend
  namespace: tdd-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: tdd-frontend

  template:
    metadata:
      labels:
        app: tdd-frontend

    spec:
      containers:
        - name: frontend
          image: uditdataxis12345/tdd-react-frontend:test

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi