apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: tdd-applications
  namespace: flux-system

spec:
  interval: 1m

  path: ./devops/flux/applications

  prune: true

  sourceRef:
    kind: GitRepository
    name: tdd-project

  dependsOn:
    - name: keda

  wait: true