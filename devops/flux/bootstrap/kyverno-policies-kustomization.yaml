apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  interval: 1m
  path: ./devops/flux/infrastructure/kyverno/policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: tdd-project
  dependsOn:
    - name: kyverno
  wait: true