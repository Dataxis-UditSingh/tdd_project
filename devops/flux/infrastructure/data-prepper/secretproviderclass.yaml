apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: data-prepper-openbao
  namespace: observability
spec:
  provider: openbao

  parameters:
    roleName: "data-prepper"

    objects: |
      - objectName: "OPENSEARCH_USERNAME"
        secretPath: "secret/data/data-prepper"
        secretKey: "OPENSEARCH_USERNAME"

      - objectName: "OPENSEARCH_PASSWORD"
        secretPath: "secret/data/data-prepper"
        secretKey: "OPENSEARCH_PASSWORD"

  secretObjects:
    - secretName: data-prepper-secrets
      type: Opaque
      data:
        - objectName: OPENSEARCH_USERNAME
          key: OPENSEARCH_USERNAME
        - objectName: OPENSEARCH_PASSWORD
          key: OPENSEARCH_PASSWORD
