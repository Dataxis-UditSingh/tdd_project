apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tdd-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: localhost
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: tdd-gateway-local-tls
      allowedRoutes:
        namespaces:
          from: All
