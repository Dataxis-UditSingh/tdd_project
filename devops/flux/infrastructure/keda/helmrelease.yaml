apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system

spec:
  interval: 10m

  releaseName: keda

  targetNamespace: keda

  chart:
    spec:
      chart: keda
      version: "2.21.0"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: true
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    operator:
      replicaCount: 1

    metricServer:
      replicaCount: 1

    webhooks:
      replicaCount: 1