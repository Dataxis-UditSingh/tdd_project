apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 10m
  releaseName: kyverno
  targetNamespace: kyverno

  chart:
    spec:
      chart: kyverno
      version: "3.6.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: true
    crds: CreateReplace

  upgrade:
    crds: CreateReplace