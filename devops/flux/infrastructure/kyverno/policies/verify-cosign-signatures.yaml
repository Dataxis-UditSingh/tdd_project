apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-tdd-frontend-cosign
  annotations:
    policies.kyverno.io/title: Verify TDD Frontend Cosign Signature
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifies the Cosign signature of the approved TDD frontend image
      using the configured public key.
spec:
  background: false
  rules:
    - name: verify-tdd-frontend-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - tdd-frontend
      verifyImages:
        - imageReferences:
            - "docker.io/uditdataxis12345/tdd-react-frontend*"
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: "k8s://kyverno/cosign-public-key"
                    rekor:
                      url: https://rekor.sigstore.dev
