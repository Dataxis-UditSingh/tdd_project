apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: flux-system
spec:
  interval: 10m
  releaseName: openbao
  targetNamespace: openbao

  chart:
    spec:
      chart: openbao
      version: "0.29.6"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
      interval: 1h

  values:
    server:
      image:
        tag: "2.6.5"

      standalone:
        enabled: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            disable_unauthed_generate_root_endpoints = false
          }

          storage "file" {
            path = "/openbao/data"
          }

      dataStorage:
        enabled: true
        size: 1Gi

      auditStorage:
        enabled: true
        size: 1Gi

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    injector:
      enabled: true
      affinity: ""
      strategy:
        type: Recreate
      agentImage:
        tag: "2.6.5"

    csi:
      enabled: true

  install:
    createNamespace: true

  upgrade:
    cleanupOnFail: true
