apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:

    exporters:
      debug:
        verbosity: detailed

      otlp:
        endpoint: data-prepper.observability.svc.cluster.local:21893
        tls:
          insecure: true

    service:
      extensions:
        - health_check

      pipelines:
        logs:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - otlp
            - debug

        traces:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - otlp
            - debug

        metrics:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - otlp
            - debug
