apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: flux-system
spec:
  interval: 10m
  releaseName: velero
  targetNamespace: velero

  chart:
    spec:
      chart: velero
      version: "12.2.1"
      sourceRef:
        kind: HelmRepository
        name: velero
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.4
        volumeMounts:
          - mountPath: /target
            name: plugins

    configuration:
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: tdd-cicd-velero-backups
          default: true
          credential:
            name: cloud-credentials
            key: cloud
          config:
            region: ap-hyderabad-1
            s3ForcePathStyle: "true"
            s3Url: https://axmpokvqajtp.compat.objectstorage.ap-hyderabad-1.oraclecloud.com

      volumeSnapshotLocation: []
      uploaderType: kopia
      defaultVolumesToFsBackup: true

    credentials:
      useSecret: true
      existingSecret: cloud-credentials

    backupsEnabled: true
    snapshotsEnabled: false
    deployNodeAgent: true

    nodeAgent:
      podSecurityContext:
        runAsUser: 0
