extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://localhost:5173
          allowed_headers:
            - content-type
            - traceparent
            - tracestate
          max_age: 7200

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

service:
  extensions:
    - health_check

  pipelines:
    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug

    traces:
      receivers:
        - otlp
      processors: 
        - batch
      exporters:
        - debug