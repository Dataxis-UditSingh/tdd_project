apiVersion: v1
kind: ConfigMap

metadata:
  name: otel-collector-config
  namespace: observability

data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:

    exporters:
      debug:
        verbosity: detailed

    service:
      extensions:
        - health_check

      pipelines:
        logs:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - debug