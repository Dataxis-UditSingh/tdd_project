apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: frontend-ci
  namespace: tdd-tekton-pipelines

spec:
  description: >
    Frontend CI pipeline for the TDD React TypeScript monorepo.
    Clones the repository, runs frontend tests, builds the frontend,
    and builds the frontend container image.

  params:
    - name: repo-url
      type: string
      description: Git repository URL.
      default: https://github.com/Dataxis-UditSingh/tdd_project.git

    - name: revision
      type: string
      description: Git branch, tag, or commit.
      default: main

    - name: image
      type: string
      description: Frontend Docker Hub repository.
      default: uditdataxis12345/tdd-react-frontend

    - name: dockerfile
      type: string
      description: Frontend Dockerfile path.
      default: devops/docker/frontend/Dockerfile

  workspaces:
    - name: source

  tasks:

    # --------------------------------
    # 1. Clone Repository
    # --------------------------------
    - name: clone
      taskRef:
        name: git-clone

      params:
        - name: url
          value: $(params.repo-url)

        - name: revision
          value: $(params.revision)

      workspaces:
        - name: source
          workspace: source

    # --------------------------------
    # 2. Generate Git SHA
    # --------------------------------
    - name: git-sha
      runAfter:
        - clone

      taskRef:
        name: git-sha

      workspaces:
        - name: source
          workspace: source


    # --------------------------------
    # 2. Frontend Tests
    # --------------------------------
    - name: test
      runAfter:
        - clone

      taskRef:
        name: npm-test

      params:
        - name: workspace
          value: frontend

      workspaces:
        - name: source
          workspace: source


    # --------------------------------
    # 3. Frontend Build
    # --------------------------------
    - name: build
      runAfter:
        - test

      taskRef:
        name: npm-build

      params:
        - name: workspace
          value: frontend

      workspaces:
        - name: source
          workspace: source


    # --------------------------------
    # 4. Build & Push Frontend Image
    # --------------------------------
    - name: build-image
      runAfter:
        - build
        - git-sha

      taskRef:
        name: build-image

      params:
        - name: IMAGE
          value: $(params.image):$(tasks.git-sha.results.image-tag)

        - name: DOCKERFILE
          value: $(params.dockerfile)

        - name: CONTEXT
          value: .

      workspaces:
        - name: source
          workspace: source