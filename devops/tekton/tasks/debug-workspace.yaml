apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: debug-workspace
  namespace: tdd-tekton-pipelines

spec:
  workspaces:
    - name: source

  steps:
    - name: inspect
      image: alpine:3.21
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        echo "=== Workspace ==="
        pwd

        echo "=== Root files ==="
        ls -la

        echo "=== Repository tree ==="
        find . -maxdepth 3 -type f | sort

        echo "=== Dockerfiles ==="
        find . -name Dockerfile -print