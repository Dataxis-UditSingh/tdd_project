apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm-build
  namespace: tdd-tekton-pipelines
spec:
  description: Build a selected npm workspace.

  params:
    - name: workspace
      type: string
      description: npm workspace to build.
      default: frontend

  workspaces:
    - name: source

  steps:
    - name: build
      image: node:22-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        npm run build --workspace $(params.workspace)