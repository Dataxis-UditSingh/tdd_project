apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm-test
  namespace: tdd-tekton-pipelines
spec:
  description: Run npm tests for a selected workspace.

  params:
    - name: workspace
      type: string
      description: npm workspace to test.
      default: frontend

  workspaces:
    - name: source

  steps:
    - name: test
      image: node:22-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        npm ci
        npm run test --workspace $(params.workspace)