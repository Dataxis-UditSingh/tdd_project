apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: github-event-listener
  namespace: tdd-tekton-pipelines

spec:
  serviceAccountName: tekton-triggers-sa

  triggers:

    - name: github-push

      interceptors:
        - ref:
            name: github

          params:
            - name: eventTypes
              value:
                - push

      bindings:
        - ref: github-push-binding

      template:
        ref: github-push-template