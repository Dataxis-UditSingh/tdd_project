
apiVersion: v1
kind: Namespace
metadata:
  name: llmd-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smollm2-inference-simulator
  namespace: llmd-demo
  labels:
    app: smollm2-inference-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smollm2-inference-simulator
  template:
    metadata:
      labels:
        app: smollm2-inference-simulator
        inference.networking.k8s.io/engine-type: vllm
    spec:
      containers:
        - name: inference-simulator
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
          args:
            - --model
            - HuggingFaceTB/SmolLM2-135M-Instruct
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smollm2-inference
  namespace: llmd-demo
spec:
  type: ClusterIP
  selector:
    app: smollm2-inference-simulator
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-inference-route
  namespace: llmd-demo
spec:
  parentRefs:
    - name: tdd-gateway
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /real-vllm
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      timeouts:
        request: 130s
        backendRequest: 120s
      backendRefs:
        - name: smollm2-inference
          port: 8000
